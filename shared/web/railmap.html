<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LBJ 实时位置</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  /* ------------------------------------------------------------------
     主题变量：body.dark / body.light 由 JS 按 night 开关切换。
     颜色与桌面版主题（theme.py）保持一致，Android 端复用同一套。
     ------------------------------------------------------------------ */
  body.dark {
    --bg: #10161c; --card: #191c21cc; --text: #d8dee6; --dim: #8c97a3;
    --border: #2b3138; --accent: #F0604F; --warn: #F0A020; --ok: #4CAF7D;
    --sub-bg: rgba(10,14,18,.78);
  }
  body.light {
    --bg: #f4f6f8; --card: #ffffffdd; --text: #1b2026; --dim: #5a6572;
    --border: #d5dce4; --accent: #DA291C; --warn: #A96500; --ok: #2E7D53;
    --sub-bg: rgba(255,255,255,.86);
  }
  html, body { height: 100%; width: 100%; margin: 0; padding: 0;
    background: var(--bg); overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    -webkit-tap-highlight-color: transparent; }
  #map { position: absolute; inset: 0; background: var(--bg); }

  /* 夜间兜底：底图没有深色版本时给瓦片层反相（标记/轨迹在独立 pane，不受影响） */
  body.nightfall .lbj-tiles { filter: invert(1) hue-rotate(180deg) brightness(.86) contrast(.92) saturate(.72); }

  /* ---------------- 列车标记 ---------------- */
  .lbj-marker { position: relative; white-space: nowrap; text-align: center;
    font: 11px/1.15 "Microsoft YaHei", sans-serif; }
  .lbj-marker .tag { display: inline-block; padding: 2px 6px; border-radius: 3px;
    color: #fff; font-weight: 700; letter-spacing: .3px;
    box-shadow: 0 1px 4px rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.35); }
  .lbj-marker .sub { display: block; margin-top: 1px; padding: 0 4px; border-radius: 2px;
    background: var(--sub-bg); color: var(--text); font-size: 9.5px; }
  .lbj-marker .dot { position: absolute; left: 50%; bottom: 0;
    width: 9px; height: 9px; margin-left: -4.5px; margin-bottom: -4.5px;
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 0 6px rgba(0,0,0,.55); }
  .lbj-marker.dim { opacity: .45; }
  .lbj-marker.mini .sub { display: none; }
  /* 选中态：放大 + 白描边 */
  .lbj-marker.sel .tag { box-shadow: 0 0 0 2px #fff, 0 1px 6px rgba(0,0,0,.6); }

  /* ---------------- 右上角图层面板 ---------------- */
  #panel { position: absolute; right: 10px; top: 10px; z-index: 500;
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; font-size: 12px; min-width: 148px; max-width: 60%;
    backdrop-filter: blur(6px); box-shadow: 0 4px 16px rgba(0,0,0,.25); overflow: hidden; }
  #panel .hd { display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    cursor: pointer; user-select: none; }
  #panel .hd b { color: var(--accent); font-size: 12px; }
  #panel .bd { display: none; padding: 0 8px 8px; }
  #panel.open .bd { display: block; }
  #panel label.row { display: flex; align-items: center; gap: 6px; margin: 5px 0;
    font-size: 12px; color: var(--text); }
  #panel select { flex: 1; min-width: 0; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; font-size: 12px; padding: 2px 3px; }
  #panel input[type=range] { flex: 1; min-width: 0; }
  #panel .hint { color: var(--dim); font-size: 10.5px; line-height: 1.5; margin-top: 6px; }
  #panel button.hb2 { flex: 1; padding: 3px 8px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font: 12px/1.4 "Microsoft YaHei", sans-serif; cursor: pointer; }
  #panel button.hb2:hover { border-color: var(--accent); color: var(--accent); }
  #panel .st { color: var(--dim); font-size: 10.5px; margin-top: 6px;
    border-top: 1px solid var(--border); padding-top: 5px; }
  #panel .st b { color: var(--ok); }
  #panel .st .bad { color: var(--warn); }

  /* ---------------- 提示条 ---------------- */
  #toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    z-index: 900; max-width: 88%; padding: 8px 12px; border-radius: 6px;
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    font-size: 12px; line-height: 1.6; display: none; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
  #toast b { color: var(--warn); }
  #hint { position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%);
    color: var(--text); font-size: 13px; line-height: 1.8; text-align: center;
    background: var(--card); padding: 14px 18px; border-radius: 6px;
    border: 1px solid var(--border); max-width: 80%; display: none; z-index: 800; }
  /* 失败提示里的「一键换底图」按钮 */
  #hint button.hb { margin: 0 4px; padding: 4px 10px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font: 12px/1.4 "Microsoft YaHei", sans-serif; cursor: pointer; }
  #hint button.hb:hover { border-color: var(--accent); color: var(--accent); }
  #hint b { color: var(--warn); }

  /* Leaflet 署名条跟随主题 */
  .leaflet-control-attribution { background: var(--card) !important;
    color: var(--dim) !important; font-size: 10px !important; }
  .leaflet-control-attribution a { color: var(--accent) !important; }
  .leaflet-bar a { background: var(--card) !important; color: var(--text) !important;
    border-color: var(--border) !important; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--card) !important; color: var(--text) !important; }
</style>
</head>
<body class="dark">
<div id="map"></div>

<div id="panel">
  <div class="hd" id="panelHd">
    <b>图层</b>
    <span id="panelSum" style="color:var(--dim);font-size:10.5px;flex:1;text-align:right"></span>
    <span id="panelArrow">▾</span>
  </div>
  <div class="bd">
    <label class="row">底图
      <select id="selBase"></select>
    </label>
    <label class="row">铁路
      <select id="selRail"></select>
    </label>
    <label class="row">不透明度
      <input id="rngRail" type="range" min="20" max="100" step="5">
    </label>
    <label class="row">缓存
      <button id="btnCache" type="button" class="hb2">缓存本区域</button>
    </label>
    <div class="st" id="cacheLine">缓存瓦片 —</div>
    <div class="st" id="statusLine">—</div>
    <div class="hint" id="hintLine"></div>
  </div>
</div>

<div id="toast"></div>
<div id="hint"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
/* ====================================================================
   railmap.html —— 桌面（Qt WebEngine）与安卓（WebView）共用的地图页。

   设计要点
   1. 单文件、零构建：Leaflet 就近引用 vendor/leaflet（离线可用）。
   2. 铁路图源 = OpenRailwayMap（WGS-84 栅格瓦片）；底图可切换。
   3. 坐标系：底图分三类——
      · WGS-84（OSM / 天地图）：标记零偏移；
      · GCJ-02（高德）：标准墨卡托瓦片，标记自动加偏；
      · BD-09（百度）：百度自有墨卡托投影，本页用纯 JS 实现 L.CRS 与瓦片编号换算，
        标记自动加偏；切换百度底图时重建地图实例。
      偏移坐标系底图与 WGS-84 铁路图层不能混叠，选中时自动关闭铁路图层并提示。
   4. 对外 API（Python / Kotlin 都只用这几个）：
        LBJ.update(payload)   批量推送列车（WGS-84 原始坐标）
        LBJ.focus(id) / clear() / setFollow(b) / locked() / center()
        LBJ.setNight(b) / isNight() / centerTo(addr) / resize()
        LBJ.applyConfig(cfg) / setBase(id) / setRailway(b) / setRailStyle(id)
        LBJ.railOpacity(v) / status() / layers()
        LBJ.centerLatLng(lat, lng[, zoom])   转到本机位置（WGS-84 入参）
        LBJ.setTrainInfo(idOrTrain, info)    补充车次/机车信息（等级/担当局/配属段/车型/
                                              机车配属/制造厂），显示在标记与弹窗里
        LBJ.onCacheProgress(done, total)     宿主回调：缓存进度
        LBJ.cacheStats(json)                 宿主回调：{count, bytes}
      离线缓存：宿主侧代拉瓦片并落盘；本页通过
        window.LBJHost.cacheArea(urlsJson)   请求缓存一批瓦片 URL
        window.LBJHost.cacheStats()          查询缓存占用
      宿主不支持时按钮会提示「当前宿主不支持离线缓存」，不影响其它功能。
   ==================================================================== */
(function () {
  'use strict';

  /* ---------------- 1. 瓦片源登记表 ---------------- */
  // noInvert: 夜间是否跳过反相滤镜（本身是深色瓦片，或卫星影像不宜反相）
  // coord: 'wgs' | 'gcj' | 'bd' —— 栅格所在大地基准：
  //   wgs = 标准 Web 墨卡托（OSM/天地图），标记零偏移；
  //   gcj = 高德 GCJ-02（标准墨卡托瓦片 + 坐标加偏），标记自动纠偏；
  //   bd  = 百度 BD-09（百度自有墨卡托投影），需要自定义 CRS，标记自动纠偏。
  // 底图清单由用户指定：天地图（需 tk）、OSM、高德免 Key、百度免 Key。
  var BASE_SOURCES = {
    osm: {
      name: 'OSM 标准', coord: 'wgs', maxNativeZoom: 19,
      url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    },
    tdt_vec: {
      name: '天地图 矢量（CGCS2000）', coord: 'wgs', maxNativeZoom: 18,
      url: 'https://t{s}.tianditu.gov.cn/vec_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0' +
           '&LAYER=vec&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles' +
           '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk={key}',
      subdomains: '01234567',
      attribution: '&copy; <a href="https://www.tianditu.gov.cn/">天地图</a> 国家地理信息公共服务平台'
    },
    tdt_img: {
      name: '天地图 影像（CGCS2000）', coord: 'wgs', maxNativeZoom: 18, noInvert: true,
      url: 'https://t{s}.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0' +
           '&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles' +
           '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk={key}',
      subdomains: '01234567',
      attribution: '&copy; <a href="https://www.tianditu.gov.cn/">天地图</a> 国家地理信息公共服务平台'
    },
    amap: {
      name: '高德 街道（免 Key）', coord: 'gcj', maxNativeZoom: 18,
      url: 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
      subdomains: '1234', attribution: '&copy; 高德地图 AutoNavi'
    },
    amap_img: {
      name: '高德 卫星（免 Key）', coord: 'gcj', maxNativeZoom: 18, noInvert: true,
      url: 'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
      subdomains: '1234', attribution: '&copy; 高德地图 AutoNavi'
    },
    baidu: {
      name: '百度 街道（免 Key）', coord: 'bd', maxNativeZoom: 18,
      url: 'https://maponline{s}.bdimg.com/tile/?qt=vtile&x={x}&y={y}&z={z}' +
           '&styles=pl&scaler=1&udt=20200818&from=jsapi',
      subdomains: '0123', attribution: '&copy; 百度地图'
    },
    baidu_sat: {
      name: '百度 卫星（免 Key）', coord: 'bd', maxNativeZoom: 18, noInvert: true,
      url: 'https://maponline{s}.bdimg.com/tile/?qt=vtile&x={x}&y={y}&z={z}' +
           '&styles=sl&scaler=1&udt=20200818&from=jsapi',
      subdomains: '0123', attribution: '&copy; 百度地图'
    }
  };

  // OpenRailwayMap 官方瓦片：多种样式，均为 WGS-84
  var RAIL_SOURCES = {
    off:    { name: '不显示', url: '' },
    orm_standard: {
      name: 'ORM 标准（线路+信号）',
      url: 'https://{s}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png',
      subdomains: 'abc', maxNativeZoom: 19
    },
    orm_maxspeed: {
      name: 'ORM 限速',
      url: 'https://{s}.tiles.openrailwaymap.org/maxspeed/{z}/{x}/{y}.png',
      subdomains: 'abc', maxNativeZoom: 19
    },
    orm_signals: {
      name: 'ORM 信号',
      url: 'https://{s}.tiles.openrailwaymap.org/signals/{z}/{x}/{y}.png',
      subdomains: 'abc', maxNativeZoom: 19
    },
    orm_electrified: {
      name: 'ORM 电气化',
      url: 'https://{s}.tiles.openrailwaymap.org/electrified/{z}/{x}/{y}.png',
      subdomains: 'abc', maxNativeZoom: 19
    },
    orm_gauge: {
      name: 'ORM 轨距',
      url: 'https://{s}.tiles.openrailwaymap.org/gauge/{z}/{x}/{y}.png',
      subdomains: 'abc', maxNativeZoom: 19
    },
    // 离线兜底：同目录下的 rail_local.geojson（自建方式见 docs/地图与图源.md）
    rail_local: {
      name: '本地铁路线（GeoJSON）',
      file: 'rail_local.geojson'
    }
  };
  var ORM_ATTR = '&copy; <a href="https://www.openrailwaymap.org/">OpenRailwayMap</a> ' +
                 '(<a href="https://www.openstreetmap.org/copyright">OSM</a>, CC-BY-SA)';

  /* ---------------- 2. 运行时配置 ---------------- */
  var DEFAULT_CONFIG = {
    base: 'amap',
    rail: 'orm_standard',
    railOpacity: 0.85,
    night: true,
    zoom: 11,
    follow: true,
    showTrail: true,
    trailMax: 240,
    // 天地图 tk（「浏览器端」类型）；留空则该底图在下拉里选中时只提示不加载
    tdtKey: '',
    // 离线瓦片缓存：宿主（桌面 QWebEngine / 安卓 WebView）支持时生效
    cacheEnabled: true,
    cacheZoomDelta: 3,          // 「缓存当前视野」额外缓存的缩放级数
    center: { lat: 28.68, lng: 115.86 },   // 缺省中心（南昌附近），配置可覆盖
    colors: { up: '#4C8DFF', down: '#F0604F', unknown: '#E0A400' }
  };
  var CONFIG = {};
  function mergeConfig(dst, src) {
    if (!src) return dst;
    for (var k in src) {
      if (!Object.prototype.hasOwnProperty.call(src, k)) continue;
      if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k])) {
        dst[k] = mergeConfig(dst[k] && typeof dst[k] === 'object' ? dst[k] : {}, src[k]);
      } else if (src[k] !== undefined && src[k] !== null) {
        dst[k] = src[k];
      }
    }
    return dst;
  }
  // 宿主注入点：桌面版把下面这行替换成 `INJECTED = {...json...};`，
  // 未替换时保持 null（页面自带缺省配置，照样能开）。
  var INJECTED = null;
  /*__LBJ_CONFIG_START__*//*__LBJ_CONFIG_END__*/
  CONFIG = mergeConfig(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), INJECTED);

  /* ---------------- 3. 坐标系 ---------------- */
  var PI = Math.PI, AXIS = 6378245.0, EE = 0.00669342162296594323;

  function outOfChina(lat, lng) {
    return !(lng > 73.66 && lng < 135.05 && lat > 3.86 && lat < 53.55);
  }
  function tLat(x, y) {
    var r = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
    r += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
    r += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
    r += (160.0 * Math.sin(y / 12.0 * PI) + 320 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
    return r;
  }
  function tLng(x, y) {
    var r = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
    r += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
    r += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
    r += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
    return r;
  }
  function wgs2gcj(lat, lng) {
    if (outOfChina(lat, lng)) return [lat, lng];
    var dLat = tLat(lng - 105.0, lat - 35.0);
    var dLng = tLng(lng - 105.0, lat - 35.0);
    var radLat = lat / 180.0 * PI;
    var magic = Math.sin(radLat);
    magic = 1 - EE * magic * magic;
    var sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180.0) / ((AXIS * (1 - EE)) / (magic * sqrtMagic) * PI);
    dLng = (dLng * 180.0) / (AXIS / sqrtMagic * Math.cos(radLat) * PI);
    return [lat + dLat, lng + dLng];
  }

  // ---- BD-09：高德/百度两家的偏移（GCJ-02 → BD-09） ----
  var X_PI = PI * 3000.0 / 180.0;
  function gcj2bd(lat, lng) {
    var z = Math.sqrt(lng * lng + lat * lat) + 0.00002 * Math.sin(lat * X_PI);
    var theta = Math.atan2(lat, lng) + 0.000003 * Math.cos(lng * X_PI);
    return [z * Math.sin(theta) + 0.006, z * Math.cos(theta) + 0.0065];
  }
  function bd2gcj(lat, lng) {
    var x = lng - 0.0065, y = lat - 0.006;
    var z = Math.sqrt(x * x + y * y) - 0.00002 * Math.sin(y * X_PI);
    var theta = Math.atan2(y, x) - 0.000003 * Math.cos(x * X_PI);
    return [z * Math.sin(theta), z * Math.cos(theta)];
  }
  function wgs2bd(lat, lng) { var g = wgs2gcj(lat, lng); return gcj2bd(g[0], g[1]); }
  // GCJ-02 → WGS-84：一阶近似反算（误差 < 1m，足够地图跟随用）
  function gcj2wgs(lat, lng) {
    var w = wgs2gcj(lat, lng);
    return [lat * 2 - w[0], lng * 2 - w[1]];
  }

  // ---- 百度墨卡托（BD-09 平面坐标），换算系数为百度官方公开值 ----
  var LLBAND = [75, 60, 45, 30, 15, 0];
  var LL2MC = [
    [-0.0015702102444, 111320.7020616939, 1704480524535203, -10338987376042340,
     26112667856603880, -35149669176653700, 26595700718403920, -10725012454188240,
     1800819912950474, 82.5],
    [0.0008277824516172526, 111320.7020463578, 647795574.6671607, -4082003173.641316,
     10774905663.51142, -15171875531.51559, 12053065338.62167, -5124939663.577472,
     913311935.9512032, 67.5],
    [0.00337398766765, 111320.7020202162, 4481351.045890365, -23393751.19931662,
     79682215.47186455, -115964993.2797253, 97236711.15602145, -43661946.33752821,
     8477230.501135234, 52.5],
    [0.00220636496208, 111320.7020209128, 51751.86112841131, 3796837.749470245,
     992013.7397791013, -1221952.21711287, 1340652.697009075, -620943.6990984312,
     144416.9293806241, 37.5],
    [-0.0003441963504368392, 111320.7020576856, 278.2353980772752, 2485758.690035394,
     6070.750963243378, 54821.18345352118, 9540.606633304236, -2710.55326746645,
     1405.483844121726, 22.5],
    [-0.0003218135878613132, 111320.7020701615, 0.00369383431289, 823725.6402795718,
     0.46104986909093, 2351.343141331292, 1.58060784298199, 8.77738589078284,
     0.37238884252424, 7.45]
  ];
  var MCBAND = [12890594.86, 8362377.87, 5591021, 3481989.83, 1678043.12, 0];
  var MC2LL = [
    [1.410526172116255e-8, 0.00000898305509648872, -1.9939833816331, 200.9824383106796,
     -187.2403703815547, 91.6087516669843, -23.38765649603339, 2.57121317296198,
     -0.03801003308653, 17337981.2],
    [-7.435856389565537e-9, 0.000008983055097726239, -0.78625201886289, 96.32687599759846,
     -1.85204757529826, -59.36935905485877, 47.40033549296737, -16.50741931063887,
     2.28786674699375, 10260144.86],
    [-3.030883460898826e-8, 0.00000898305509983578, 0.30071316287616, 59.74293618442277,
     7.357984074871, -25.38371002664745, 13.45380521110908, -3.29883767235584,
     0.32710905363475, 6856817.37],
    [-1.981981304930552e-8, 0.000008983055099779535, 0.03278182852591, 40.31678527705744,
     0.65659298677277, -4.44255534477492, 0.85341911805263, 0.12923347998204,
     -0.04625736007561, 4482777.06],
    [3.09191371068437e-9, 0.000008983055096812155, 0.00006995724062, 23.10934304144901,
     -0.00023663490511, -0.6321817810242, -0.00663494467273, 0.03430082397953,
     -0.00466043876332, 2555164.4],
    [2.890871144776878e-9, 0.000008983055095805407, -3.068298e-8, 7.47137025468032,
     -0.00000353937994, -0.02145144861037, -0.00001234426596, 0.00010322952773,
     -0.00000323890364, 826088.5]
  ];
  function getLoop(v, a, b) {
    while (v > b) v -= b - a;
    while (v < a) v += b - a;
    return v;
  }
  function getRange(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function ll2mc(lng, lat) {
    lng = getLoop(lng, -180, 180);
    lat = getRange(lat, -74, 74);
    var cf = null, i;
    for (i = 0; i < LLBAND.length; i++) { if (lat >= LLBAND[i]) { cf = LL2MC[i]; break; } }
    if (!cf) { for (i = LLBAND.length - 1; i >= 0; i--) { if (lat <= -LLBAND[i]) { cf = LL2MC[i]; break; } } }
    if (!cf) return [0, 0];
    var x = cf[0] + cf[1] * Math.abs(lng);
    var t = Math.abs(lat) / cf[9];
    var y = cf[2] + cf[3] * t + cf[4] * t * t + cf[5] * t * t * t +
            cf[6] * Math.pow(t, 4) + cf[7] * Math.pow(t, 5) + cf[8] * Math.pow(t, 6);
    return [x, y * (lat >= 0 ? 1 : -1)];
  }
  function mc2ll(x, y) {
    var cf = null, i;
    for (i = 0; i < MCBAND.length; i++) { if (Math.abs(y) >= MCBAND[i]) { cf = MC2LL[i]; break; } }
    if (!cf) return [0, 0];
    var lng = cf[0] + cf[1] * Math.abs(x);
    var t = Math.abs(y) / cf[9];
    var lat = cf[2] + cf[3] * t + cf[4] * t * t + cf[5] * t * t * t +
              cf[6] * Math.pow(t, 4) + cf[7] * Math.pow(t, 5) + cf[8] * Math.pow(t, 6);
    return [lng * (x >= 0 ? 1 : -1), lat * (y >= 0 ? 1 : -1)];
  }

  // 百度自有墨卡托 CRS（官方换算系数 + 像素=米*2^(zoom-18) 的变换）。
  // 与 ZhenFu/leaflet-baidu 的 BEPSG3857 等价，但这里用纯 JS 实现、不依赖百度 JS API。
  var L_BAIDU_CRS = L.extend({}, L.CRS, {
    code: 'Baidu',
    projection: {
      project: function (latlng) {
        var mc = ll2mc(latlng.lng, latlng.lat);
        return new L.Point(mc[0], mc[1]);
      },
      unproject: function (point) {
        var ll = mc2ll(point.x, point.y);
        return new L.LatLng(ll[1], ll[0]);
      },
      bounds: (function () {
        var MAX = 33554432;
        return new L.Bounds(new L.Point(-MAX, -MAX), new L.Point(MAX, MAX));
      })()
    },
    transformation: new L.Transformation(Math.pow(2, -26), 0.5, -Math.pow(2, -26), 0.5),
    scale: function (zoom) { return 256 * Math.pow(2, zoom); },
    zoom: function (scale) { return Math.log(scale / 256) / Math.LN2; },
    infinite: true
  });

  // 百度瓦片编号与 Leaflet 瓦片索引不同：百度以世界中心为原点（z 层共 2^z 块）
  var BaiduTileLayer = L.TileLayer.extend({
    getTileUrl: function (coords) {
      var offset = Math.pow(2, coords.z - 1);
      var bx = coords.x - offset;
      var by = offset - coords.y - 1;
      return this._url
        .replace('{s}', this._getSubdomain(coords))
        .replace('{x}', bx).replace('{y}', by).replace('{z}', coords.z);
    }
  });

  var baseId = BASE_SOURCES[CONFIG.base] ? CONFIG.base : 'amap';
  var railId = RAIL_SOURCES[CONFIG.rail] ? CONFIG.rail : 'orm_standard';
  function coordMode() { return (BASE_SOURCES[baseId] || {}).coord || 'wgs'; }
  function isBaiduBase() { return coordMode() === 'bd'; }
  function isOffsetBase() { return coordMode() !== 'wgs'; }
  // 原始 WGS-84 → 当前底图坐标
  function toMap(lat, lng) {
    var m = coordMode();
    if (m === 'gcj') return wgs2gcj(lat, lng);
    if (m === 'bd') return wgs2bd(lat, lng);
    return [lat, lng];
  }
  // 当前底图坐标 → WGS-84（宿主展示/跟随复位用）
  function fromMap(lat, lng) {
    var m = coordMode();
    if (m === 'gcj') return gcj2wgs(lat, lng);
    if (m === 'bd') { var g = bd2gcj(lat, lng); return gcj2wgs(g[0], g[1]); }
    return [lat, lng];
  }

  /* ---------------- 4. 地图与图层 ---------------- */
  var map = null;
  // 瓦片统计必须**按图层分开**：以前底图与铁路共用一个计数器，
  // 只要铁路瓦片（ORM 需要 Referer，缺了会 403）失败，就会把底图误判成「不可达」。
  var baseLayer = null, railLayer = null;
  var baseTileOk = 0, baseTileFail = 0;
  var railTileOk = 0, railTileFail = 0;
  var railFailWarned = false;
  // 兼容旧调用（宿主 status() 读 tilesTotal/tilesFailed）：只反映底图
  function tilesTotal() { return baseTileOk; }
  function tilesFailed() { return baseTileFail; }
  var userTouched = false, follow = CONFIG.follow !== false, night = CONFIG.night !== false;
  var railUserOff = false;   // 用户手动把铁路图层关掉了：换底图时不要自作主张再打开
  // 偏移底图（高德/百度）会自动暂停铁路图层；这两个变量记住「用户想要的图层」，
  // 让 notifyHost 不把暂停状态落盘，并在切回 WGS-84 底图时自动恢复。
  var railWanted = 'orm_standard';
  var railAutoOff = false;
  var lastFocusId = null, lastAuto = null;
  var centerApplied = false;   // 默认中心只应用一次，之后由跟随/用户操作决定视图

  // 坐标系切换（标准墨卡托 ↔ 百度自有墨卡托）必须重建地图实例
  function createMap(centerLatLng, zoom) {
    if (map) { map.remove(); map = null; }
    var opts = {
      center: centerLatLng,
      zoom: zoom,
      zoomControl: true,
      preferCanvas: true,
      attributionControl: true,
      worldCopyJump: false
    };
    if (isBaiduBase()) opts.crs = L_BAIDU_CRS;
    map = L.map('map', opts);
    map.attributionControl.setPrefix('');
    // 独立 pane：底图 < 铁路 < 轨迹 < 标记
    map.createPane('railPane');   map.getPane('railPane').style.zIndex = 300;
    map.createPane('trailPane');  map.getPane('trailPane').style.zIndex = 410;
    map.createPane('markerPane').style.zIndex = 620;
    // 用户动过地图就不再自动跟随
    ['mousedown', 'touchstart', 'wheel', 'dragstart'].forEach(function (ev) {
      map.getContainer().addEventListener(ev, markTouched, { passive: true });
    });
    map.on('zoomend moveend', function () { scheduleStatus(); });
  }
  function markTouched() { userTouched = true; }
  function currentCenterWgs() {
    if (!map) return [CONFIG.center.lat || 28.68, CONFIG.center.lng || 115.86];
    var c = map.getCenter();
    return fromMap(c.lat, c.lng);
  }
  function currentZoom() { return map ? map.getZoom() : (CONFIG.zoom || 11); }

  // 瓦片事件分图层统计：底图失败才算「底图不可达」，铁路失败只影响铁路提示。
  function tileHooks(layer, kind) {
    var isRail = (kind === 'rail');
    layer.on('tileerror', function () {
      if (isRail) { railTileFail++; warnRailFail(); } else { baseTileFail++; }
      scheduleStatus();
    });
    layer.on('tileload', function () {
      if (isRail) railTileOk++; else baseTileOk++;
      scheduleStatus();
    });
    return layer;
  }
  // 铁路瓦片失败：只提示一次，不误伤底图判定（ORM 需 Referer，缺 Referer 会 403）
  function warnRailFail() {
    if (railFailWarned) return;
    if (railTileFail < 4) return;
    railFailWarned = true;
    toast('<b>铁路图层瓦片加载失败</b>：OpenRailwayMap 需要合法 Referer，' +
          '请确认客户端版本（v3.2 起已内置）。也可改用「本地铁路线（GeoJSON）」。', 7000);
  }

  function buildBase() {
    var src = BASE_SOURCES[baseId];
    if (baseLayer) { map.removeLayer(baseLayer); baseLayer = null; }
    var url = String(src.url || '').replace('{key}', CONFIG.tdtKey || '');
    var opts = {
      subdomains: src.subdomains || 'abc',
      maxNativeZoom: src.maxNativeZoom || 18,
      maxZoom: 19,
      attribution: src.attribution || '',
      className: 'lbj-tiles',
      crossOrigin: false,
      detectRetina: false
    };
    // 百度瓦片编号与 Leaflet 索引不同，用专用子类换算
    baseLayer = isBaiduBase() ? new BaiduTileLayer(url, opts) : L.tileLayer(url, opts);
    baseLayer.addTo(map);
    tileHooks(baseLayer, 'base');
    applyNightFallback();
  }

  function buildRail() {
    if (railLayer) { map.removeLayer(railLayer); railLayer = null; }
    railTileOk = 0; railTileFail = 0; railFailWarned = false;
    var src = RAIL_SOURCES[railId];
    if (!src) return;
    if (src.file) { buildLocalRail(src); return; }
    if (!src.url) return;
    railLayer = L.tileLayer(src.url, {
      pane: 'railPane',
      subdomains: src.subdomains || 'abc',
      maxNativeZoom: src.maxNativeZoom || 19,
      maxZoom: 19,
      opacity: Math.min(1, Math.max(0.2, CONFIG.railOpacity || 0.85)),
      attribution: ORM_ATTR,
      className: 'lbj-rail',
      detectRetina: false,
      // ORM 官方瓦片对 UA 与 Referer 有要求：宿主（桌面/安卓）会在请求层补
      // Referer: https://www.openrailwaymap.org/，页面这边保持常规浏览器标识。
      crossOrigin: false
    });
    railLayer.addTo(map);
    tileHooks(railLayer, 'rail');
  }

  // 离线兜底：读取同目录 rail_local.geojson（用户自建，见 docs/地图与图源.md）
  function buildLocalRail(src) {
    function fail(msg) {
      toast('<b>本地铁路线加载失败</b>：' + msg +
            '<br>把自建的 <code>rail_local.geojson</code> 放到 shared/web/ 下（做法见文档）。', 7000);
      railId = 'off';
      var sr = document.getElementById('selRail'); if (sr) sr.value = 'off';
      refreshStatus();
    }
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', src.file, true);
      xhr.onload = function () {
        var data = null;
        try { data = JSON.parse(xhr.responseText); } catch (e) { fail('JSON 解析失败'); return; }
        if (!data || !data.features || !data.features.length) { fail('文件为空或不是 GeoJSON'); return; }
        railLayer = L.geoJSON(data, {
          pane: 'railPane',
          style: function () {
            return { color: '#8B5CF6', weight: 2.2,
                     opacity: Math.min(1, Math.max(0.2, CONFIG.railOpacity || 0.85)) };
          }
        }).addTo(map);
        refreshStatus();
      };
      xhr.onerror = function () { fail('未找到文件 rail_local.geojson'); };
      xhr.send();
    } catch (e) {
      fail(String(e));
    }
  }

  // 夜间：底图有深色版就换源，否则给瓦片层反相
  function applyNightFallback() {
    var src = BASE_SOURCES[baseId] || {};
    var need = night && !src.noInvert;
    document.body.classList.toggle('nightfall', !!need);
  }

  /* ---------------- 5. 列车标记与轨迹 ---------------- */
  var state = {};   // id -> {marker, line, data, trail:[[lat,lng]...]}

  function markerHtml(d, sel, mini) {
    var col = (CONFIG.colors || {})[
      d.direction === '上行' ? 'up' : (d.direction === '下行' ? 'down' : 'unknown')] || '#888';
    var title = escapeHtml(d.train || d.id || '----');
    var sub = markerSub(d);
    var cls = 'lbj-marker' + (sel ? ' sel' : '') + (mini ? ' mini' : '');
    return '<div class="' + cls + '"><span class="tag" style="background:' + col + '">' +
      title + '</span>' + (sub.length ? '<span class="sub">' + escapeHtml(sub.join(' · ')) + '</span>' : '') +
      '<span class="dot" style="background:' + col + '"></span></div>';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  // 车次/机车信息（宿主异步查询后随 update 或 setTrainInfo 送来）：
  //   grade 等级 · bureau 担当局 · section 担当段/客运段 · owner 配属段/车辆段
  //   model 车型 · locoDepot 机车配属单位 · locoMaker 制造厂 · from/to 始发终到
  function infoRows(d) {
    var info = (d && d.info) || {};
    var rows = [];
    var grade = info.grade || '';
    var line1 = [grade, info.bureau, info.section].filter(Boolean).join(' · ');
    if (line1) rows.push(['车次信息', line1]);
    var owner = info.owner || '';
    var line2 = [owner, info.model].filter(Boolean).join(' · ');
    if (line2) rows.push(['车底', line2]);
    if (info.from || info.to) {
      rows.push(['区间', (info.from || '?') + ' → ' + (info.to || '?')]);
    }
    var locoLine = [info.locoDepot, info.locoMaker].filter(Boolean).join(' · ');
    if (locoLine) rows.push(['机车配属', locoLine]);
    return rows;
  }
  function markerSub(d) {
    var bits = [];
    if (d.speed && d.speed !== '---') bits.push(d.speed + ' km/h');
    if (d.km && d.km !== '---.-') bits.push('K' + d.km);
    var info = d.info || {};
    if (info.grade) bits.push(info.grade);
    return bits;
  }

  function upsertTrain(d) {
    var id = String(d.id || d.train || '----');
    var st = state[id];
    var pos = toMap(Number(d.lat), Number(d.lon));
    if (!isFinite(pos[0]) || !isFinite(pos[1])) return;
    if (!st) {
      var mk = L.marker(pos, {
        pane: 'markerPane',
        icon: L.divIcon({
          className: '', html: markerHtml(d, false, false),
          iconSize: [0, 0], iconAnchor: [0, 0]
        }),
        riseOnHover: true,
        zIndexOffset: 100
      });
      mk.on('click', function () { showInfo(id); });
      st = state[id] = { marker: mk, line: null, data: d, trail: [], ts: 0 };
      mk.addTo(map);
    } else {
      // 位置类字段用新数据，info 字段做浅合并（后到的车次查询结果不会被空值覆盖）
      var merged = d;
      if (st.data && st.data.info) {
        merged = {};
        for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) merged[k] = d[k];
        var info = {};
        for (var k1 in st.data.info) info[k1] = st.data.info[k1];
        for (var k2 in (d.info || {})) info[k2] = d.info[k2];
        merged.info = info;
      }
      st.marker.setLatLng(pos);
      st.marker.setIcon(L.divIcon({
        className: '', html: markerHtml(merged, lastFocusId === id, false),
        iconSize: [0, 0], iconAnchor: [0, 0]
      }));
      st.data = merged;
    }

    // 轨迹抽稀：位移 > 6m 或距上一点 > 3s 才记
    var trail = st.trail;
    var now = Number(d.ts) || (Date.now() / 1000);
    var keep = true;
    if (trail.length) {
      var lo = trail[trail.length - 1];
      var moved = Math.abs(lo[0] - d.lat) + Math.abs(lo[1] - d.lon) > 6e-5;
      keep = moved || (now - (st.ts || 0)) > 3.0;
    }
    if (keep) {
      trail.push([Number(d.lat), Number(d.lon)]);
      st.ts = now;
      while (trail.length > (CONFIG.trailMax || 240)) trail.shift();
    }
    if (CONFIG.showTrail !== false && trail.length >= 2) {
      var pts = trail.map(function (p) { return toMap(p[0], p[1]); });
      if (!st.line) {
        st.line = L.polyline(pts, {
          pane: 'trailPane', color: '#DA291C', weight: 3, opacity: .85,
          lineJoin: 'round', dashArray: null
        }).addTo(map);
      } else {
        st.line.setLatLngs(pts);
      }
    }
  }

  function showInfo(id) {
    var st = state[id];
    if (!st) return;
    var d = st.data;
    var span = trailSpan(st.trail);
    var rows = [
      ['车次', d.train || '----'],
      ['方向', d.direction || '未知'],
      ['速度', (d.speed || '---') + ' km/h'],
      ['公里标', 'K' + (d.km || d.position || '---.-')],
      ['线路', d.route || '----'],
      ['机车', d.loco || '----'],
      ['类别', d.category || '----']
    ];
    // 车次等级 / 担当路局 / 担当段 / 配属段 / 车型 / 机车配属 / 制造厂
    rows = rows.concat(infoRows(d));
    rows.push(['收到', d.time || '----']);
    if (span) rows.push(['轨迹里程', span]);
    rows.push(['坐标', Number(d.lat).toFixed(5) + ', ' + Number(d.lon).toFixed(5)]);
    var html = '<div style="font-size:12px;line-height:1.9">' +
      rows.map(function (r) {
        return '<div><span style="color:var(--dim);display:inline-block;min-width:56px">' +
          escapeHtml(r[0]) + '</span>' + escapeHtml(r[1]) + '</div>';
      }).join('') + '</div>';
    L.popup({ closeButton: true, autoPan: false })
      .setLatLng(st.marker.getLatLng()).setContent(html).openOn(map);
  }

  function trailSpan(trail) {
    if (!trail || trail.length < 2) return '';
    var dist = 0;
    for (var i = 1; i < trail.length; i++) {
      var dy = (trail[i][0] - trail[i - 1][0]) * 111.0;
      var dx = (trail[i][1] - trail[i - 1][1]) * 111.0 * Math.cos(trail[i][0] * PI / 180);
      dist += Math.sqrt(dx * dx + dy * dy);
    }
    return dist >= 0.1 ? dist.toFixed(1) + ' km' : Math.round(dist * 1000) + ' m';
  }

  function haversine(a, b) {
    var R = 6371000, dLat = (b[0] - a[0]) * PI / 180, dLng = (b[1] - a[1]) * PI / 180;
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(a[0] * PI / 180) * Math.cos(b[0] * PI / 180) *
      Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
  }

  function autoCenter(id, pos) {
    if (!follow || userTouched) return;
    if (id !== lastFocusId && lastFocusId !== null) return;   // 只跟当前关注的车
    if (lastAuto && haversine(lastAuto, pos) < 30) return;    // 30m 内不重设中心
    lastAuto = pos;
    map.setView(pos, map.getZoom(), { animate: false });
  }

  /* ---------------- 6. 面板与状态 ---------------- */
  var tileFailTimer = null;
  function scheduleStatus() {
    if (tileFailTimer) return;
    tileFailTimer = setTimeout(function () { tileFailTimer = null; refreshStatus(); }, 700);
  }

  var _hostLast = '';
  function notifyHost() {
    // 自动暂停（偏移底图）时上报「用户想要的图层」，避免把 rail=off 写进配置，
    // 否则切回 OSM/天地图后铁路图层永远恢复不了。
    var reportedRail = railAutoOff ? (railWanted || 'orm_standard') : railId;
    var payload = { base: baseId, rail: reportedRail,
                    railOpacity: CONFIG.railOpacity, night: night };
    var sig = payload.base + '|' + payload.rail + '|' + payload.railOpacity + '|' + payload.night;
    if (sig === _hostLast) return;          // 只有组合真的变了才通知宿主
    _hostLast = sig;
    try {
      if (window.LBJHost && typeof window.LBJHost.onLayers === 'function') {
        window.LBJHost.onLayers(JSON.stringify(payload));
      }
    } catch (e) { /* 宿主不存在时静默 */ }
  }

  function refreshStatus() {
    notifyHost();
    var src = BASE_SOURCES[baseId] || {}, rail = RAIL_SOURCES[railId] || {};
    document.getElementById('panelSum').textContent =
      src.name + (rail.url ? ' + ORM' : '');
    var st = document.getElementById('statusLine');
    var railBit = '';
    if (rail.url || rail.file) {
      railBit = ' · 铁路 ' + railTileOk + (railTileFail ? '<span class="bad">/' + railTileFail + ' 失败</span>' : '');
    }
    st.innerHTML = '底图 <b class="' + (baseTileFail > 0 ? 'bad' : '') + '">' + escapeHtml(src.name) + '</b>' +
      ' · 瓦片 ' + baseTileOk + (baseTileFail ? '<span class="bad">，失败 ' + baseTileFail + '</span>' : '') +
      railBit +
      '<br>铁路 ' + escapeHtml(rail.name || '—') + ' · 坐标 ' +
      (coordMode() === 'bd' ? 'BD-09（已纠偏标记）' :
       (coordMode() === 'gcj' ? 'GCJ-02（已纠偏标记）' : 'WGS-84'));
    var hint = document.getElementById('hintLine');
    // 只有「底图」失败才算不可达；铁路失败单独一行说明，绝不把底图判成不可达
    if (baseTileFail > 4 && baseTileOk > 0 && baseTileFail > baseTileOk) {
      hint.innerHTML = '<b>底图瓦片部分失败</b>：' + baseTileOk + ' 张已加载、' +
        baseTileFail + ' 张失败。若地图显示正常可忽略；持续异常请换一张底图。';
    } else if (railTileFail > 4 && railTileOk === 0) {
      hint.innerHTML = '<b>铁路图层不可用</b>：OpenRailwayMap 瓦片全部失败' +
        '（需要合法 Referer，v3.2 起客户端已内置）。可改用「本地铁路线（GeoJSON）」。';
    } else if (isOffsetBase() && railId !== 'off') {
      hint.innerHTML = '<b>坐标不混叠</b>：当前底图为偏移坐标系，已自动关闭 WGS-84 铁路图层。';
    } else if (railId !== 'off') {
      hint.innerHTML = '铁路图源 OpenRailwayMap · 中国境内覆盖取决于 OSM 数据完整度。';
    } else {
      hint.innerHTML = '未叠加铁路图层。';
    }
    // 全屏提示只在「底图真的完全不可达」时出现：必须有失败样本、
    // 且一张都没成功（或失败率 ≥ 95%），避免误判可达的底图。
    var reallyDead = baseTileFail >= 6 &&
      (baseTileOk === 0 || baseTileFail >= baseTileOk * 19);
    showHint(reallyDead);
  }

  function showHint(on) {
    var el = document.getElementById('hint');
    if (on) {
      // 给出可直接点的备选：国内网络下 OSM 可达性波动，高德/百度免 Key 且通常可达。
      el.innerHTML = '<b>底图瓦片加载失败</b><br>' +
        '当前网络访问不到「' + escapeHtml((BASE_SOURCES[baseId] || {}).name || baseId) + '」。<br>' +
        '可换用国内通常可达的两张：高德（免 Key，偏移坐标系）、OSM（WGS-84，可叠铁路图层）。' +
        '<div style="margin-top:8px">' +
        '<button class="hb" data-base="amap">换成高德街道</button>' +
        '<button class="hb" data-base="osm">换成 OSM</button>' +
        '</div>';
      var btns = el.querySelectorAll('button.hb');
      for (var i = 0; i < btns.length; i++) {
        btns[i].onclick = function () { setBase(this.getAttribute('data-base')); };
      }
      el.style.display = 'block';
    } else {
      el.style.display = 'none';
    }
  }

  var toastTimer = null;
  function toast(msg, ms) {
    var el = document.getElementById('toast');
    el.innerHTML = msg;
    el.style.display = 'block';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.style.display = 'none'; }, ms || 4200);
  }

  function buildSelects() {
    var sb = document.getElementById('selBase');
    sb.innerHTML = '';
    for (var k in BASE_SOURCES) {
      if (!BASE_SOURCES.hasOwnProperty(k)) continue;
      var o = document.createElement('option');
      o.value = k; o.textContent = BASE_SOURCES[k].name;
      if (k === baseId) o.selected = true;
      sb.appendChild(o);
    }
    sb.onchange = function () { setBase(this.value); };
    var sr = document.getElementById('selRail');
    sr.innerHTML = '';
    for (var r in RAIL_SOURCES) {
      if (!RAIL_SOURCES.hasOwnProperty(r)) continue;
      var o2 = document.createElement('option');
      o2.value = r; o2.textContent = RAIL_SOURCES[r].name;
      if (r === railId) o2.selected = true;
      sr.appendChild(o2);
    }
    sr.onchange = function () { setRailStyle(this.value); };
    var rng = document.getElementById('rngRail');
    rng.value = Math.round((CONFIG.railOpacity || 0.85) * 100);
    rng.oninput = function () { railOpacity(this.value / 100); };
  }

  /* ---------------- 7. 交互（mousedown/touch 等已在 createMap 里挂到地图容器） ---------------- */

  /* ---------------- 8. 对外 API ---------------- */
  var api = {
    update: function (payload) {
      if (!payload || typeof payload !== 'object') return;
      if (typeof payload.night === 'boolean' && payload.night !== night) api.setNight(payload.night);
      if (typeof payload.follow === 'boolean') follow = payload.follow;
      if (typeof payload.showTrail === 'boolean') CONFIG.showTrail = payload.showTrail;
      var trains = payload.trains || [];
      var newest = null, newestTs = -1;
      for (var i = 0; i < trains.length; i++) {
        var d = trains[i];
        if (d == null || d.lat == null || d.lon == null) continue;
        upsertTrain(d);
        var ts = Number(d.ts) || 0;
        if (ts > newestTs) { newestTs = ts; newest = d; }
      }
      if (payload.focus != null && state[String(payload.focus)]) {
        var st = state[String(payload.focus)];
        lastFocusId = String(payload.focus);
        userTouched = false;
        lastAuto = null;
        map.setView(st.marker.getLatLng(), Math.max(map.getZoom(), 10), { animate: false });
      } else if (newest && follow) {
        if (lastFocusId == null) lastFocusId = String(newest.id || newest.train);
        if (String(newest.id || newest.train) === String(lastFocusId)) {
          var s2 = state[String(lastFocusId)];
          if (s2) autoCenter(lastFocusId, s2.marker.getLatLng());
        }
      }
      scheduleStatus();
    },
    // Android 简单入口：单车推送
    pushTrain: function (lat, lng, name, id, opts) {
      var d = { id: id || name, train: name, lat: Number(lat), lon: Number(lng),
                ts: Date.now() / 1000 };
      if (opts && typeof opts === 'object') for (var k in opts) d[k] = opts[k];
      api.update({ trains: [d], follow: true });
    },
    /**
     * 补充某趟车的车次/机车信息（宿主异步查询回来后调用，不改变位置）。
     * @param {string} idOrTrain 标记 id 或车次号
     * @param {object|string} info  {grade,bureau,section,owner,model,locoDepot,locoMaker,from,to}
     *                              或该对象的 JSON 字符串
     */
    setTrainInfo: function (idOrTrain, info) {
      var key = String(idOrTrain == null ? '' : idOrTrain);
      if (!key) return 0;
      if (typeof info === 'string') {
        try { info = JSON.parse(info); } catch (e) { return 0; }
      }
      if (!info || typeof info !== 'object') return 0;
      var hit = 0;
      for (var k in state) {
        if (!state.hasOwnProperty(k)) continue;
        var st = state[k];
        var d = st.data || {};
        if (k === key || String(d.train || '') === key) {
          var merged = {};
          for (var k1 in (d.info || {})) merged[k1] = d.info[k1];
          for (var k2 in info) merged[k2] = info[k2];
          d.info = merged;
          st.data = d;
          if (st.marker) {
            st.marker.setIcon(L.divIcon({
              className: '', html: markerHtml(d, lastFocusId === k, false),
              iconSize: [0, 0], iconAnchor: [0, 0]
            }));
          }
          hit++;
        }
      }
      if (hit) scheduleStatus();
      return hit;
    },
    focus: function (id) {
      var st = state[String(id)];
      if (!st) return;
      lastFocusId = String(id);
      userTouched = false;
      lastAuto = null;
      map.setView(st.marker.getLatLng(), Math.max(map.getZoom(), 10), { animate: true });
    },
    clear: function () {
      for (var k in state) {
        if (!state.hasOwnProperty(k)) continue;
        if (state[k].marker) map.removeLayer(state[k].marker);
        if (state[k].line) map.removeLayer(state[k].line);
      }
      state = {};
      lastFocusId = null;
      lastAuto = null;
      map.closePopup();
      scheduleStatus();
    },
    setFollow: function (on) {
      follow = !!on;
      if (follow) { userTouched = false; lastAuto = null; }
    },
    follow: function () { return follow; },
    locked: function () { return !!userTouched; },
    unlock: function () { userTouched = false; },
    // 返回 WGS-84（与推送坐标同一基准，宿主可直接落盘/展示）
    center: function () { var w = currentCenterWgs(); return [w[1], w[0]]; },
    setNight: function (on) {
      night = !!on;
      document.body.classList.toggle('light', !night);
      document.body.classList.toggle('dark', night);
      applyNightFallback();
      refreshStatus();
    },
    isNight: function () { return night; },
    // 默认中心：addr 为空则用 CONFIG.center（Leaflet 离线不依赖地名解析）
    centerTo: function (addr) {
      var c = CONFIG.center || {};
      if (c.lat && c.lng) {
        map.setView(toMap(c.lat, c.lng), Math.max(CONFIG.zoom || 11, 8), { animate: true });
        toast('已回到默认中心' + (addr ? '：' + escapeHtml(addr) : ''), 2600);
      } else {
        toast('<b>未配置默认中心</b>：请在设置里填写中心经纬度或选择预设城市。', 5200);
      }
    },
    // 「转到本机位置」（WGS-84 入参）：居中并停止自动跟随
    centerLatLng: function (lat, lng, zoom) {
      var la = Number(lat), ln = Number(lng);
      if (!isFinite(la) || !isFinite(ln)) return false;
      centerApplied = true;
      userTouched = true;   // 停止自动跟随，避免下一帧被拉回
      lastAuto = null;
      map.setView(toMap(la, ln), Number(zoom) || Math.max(map.getZoom(), 11), { animate: true });
      toast('已转到本机位置', 2600);
      return true;
    },
    resize: function () { map.invalidateSize(false); },
    setBase: setBase,
    base: function () { return baseId; },
    setRailway: function (on) { setRailStyle(on ? 'orm_standard' : 'off'); },
    setRailStyle: setRailStyle,
    railOpacity: railOpacity,
    rail: function () { return railId; },
    coordMode: coordMode,
    status: function () {
      var w = currentCenterWgs();
      return {
        base: baseId, rail: railId, coord: coordMode(), night: night, follow: follow,
        locked: userTouched, zoom: map ? map.getZoom() : 0,
        center: [w[1], w[0]], tilesTotal: baseTileOk, tilesFailed: baseTileFail,
        railTilesTotal: railTileOk, railTilesFailed: railTileFail
      };
    },
    layers: function () {
      var out = [];
      for (var k in BASE_SOURCES) if (BASE_SOURCES.hasOwnProperty(k)) {
        out.push({ id: k, name: BASE_SOURCES[k].name, coord: BASE_SOURCES[k].coord, kind: 'base' });
      }
      for (var r in RAIL_SOURCES) if (RAIL_SOURCES.hasOwnProperty(r)) {
        out.push({ id: r, name: RAIL_SOURCES[r].name, coord: 'wgs', kind: 'rail' });
      }
      return out;
    },
    applyConfig: function (cfg) { applyConfig(cfg); },
    ready: true
  };
  window.LBJ = api;
  // 兼容旧调用（安卓 M0~M3 用过的名字）
  window.updateTrain = function (lat, lng, name, follow) {
    if (typeof follow === 'boolean') api.setFollow(follow);
    api.pushTrain(lat, lng, name, name, null);
  };

  function setBase(id) {
    if (!BASE_SOURCES[id] || id === baseId) return;
    if (BASE_SOURCES[id].url.indexOf('{key}') >= 0 && !CONFIG.tdtKey) {
      toast('<b>该底图需要天地图 Key</b>：到 tianditu.gov.cn 申请「浏览器端」tk，' +
            '填到 设置 → 地图 → 天地图 Key。', 7000);
      var sb0 = document.getElementById('selBase'); if (sb0) sb0.value = baseId;
      return;
    }
    // 标准墨卡托 ↔ 百度墨卡托要换 CRS：保存 WGS-84 中心与缩放，重建地图实例
    var needRecreate = (BASE_SOURCES[id].coord === 'bd') !== isBaiduBase();
    var wgsCenter = currentCenterWgs();
    var zoom = currentZoom();
    baseId = id;
    baseTileOk = 0; baseTileFail = 0;   // 换底图后重新统计（铁路统计随 buildRail 重置）
    if (needRecreate) {
      createMap(toMap(wgsCenter[0], wgsCenter[1]), zoom);
      buildBase();
      buildRail();
      rebuildMarkers();
      setTimeout(function () { map.invalidateSize(false); }, 30);
    } else {
      buildBase();
      rebuildMarkers();
    }
    // 面板下拉同步：工具栏/程序换的底图，页面内的 <select> 也要跟着变
    var sbNow = document.getElementById('selBase');
    if (sbNow && sbNow.value !== id) sbNow.value = id;
    // 偏移坐标系底图（高德 GCJ-02 / 百度 BD-09）与 WGS-84 铁路图层不混叠：自动关掉铁路图层。
    // 注意区分「自动关」与「用户手动关」：
    //   · 自动关只影响当前显示，**不落盘**（notifyHost 仍上报用户想要的图层）；
    //   · 切回 WGS-84 底图（OSM/天地图）时自动恢复，用户不用每次手动再开一遍。
    if (isOffsetBase() && railId !== 'off') {
      railWanted = railId;          // 记住用户想要的铁路图层
      railAutoOff = true;
      railId = 'off';
      if (railLayer) { map.removeLayer(railLayer); railLayer = null; }
      var sr = document.getElementById('selRail'); if (sr) sr.value = 'off';
      toast('<b>铁路图层已暂停</b>：' + escapeHtml(BASE_SOURCES[id].name) +
        ' 为偏移坐标系（' + (coordMode() === 'bd' ? 'BD-09' : 'GCJ-02') +
        '），与 OpenRailwayMap（WGS-84）叠加会错位。<br>换成 OSM / 天地图后会自动恢复。', 7000);
    } else if (!isOffsetBase()) {
      var restore = '';
      if (railAutoOff) {
        restore = railWanted || 'orm_standard';
        railAutoOff = false;
      } else if (railId === 'off' && !railUserOff && CONFIG.rail && CONFIG.rail !== 'off') {
        restore = CONFIG.rail;
      }
      if (restore) {
        railId = restore;
        if (RAIL_SOURCES[railId]) railWanted = railId;
        buildRail();
        var sr2 = document.getElementById('selRail'); if (sr2) sr2.value = railId;
      }
    }
    refreshStatus();
  }

  function setRailStyle(id) {
    if (!RAIL_SOURCES[id]) return;
    if (isOffsetBase() && id !== 'off') {
      toast('<b>无法叠加</b>：当前底图是偏移坐标系（' +
        (coordMode() === 'bd' ? '百度 BD-09' : '高德 GCJ-02') +
        '），铁路图源是 WGS-84。请先把底图换成 OSM / 天地图。', 6500);
      var sr = document.getElementById('selRail'); if (sr) sr.value = railId;
      return;
    }
    railId = id;
    railUserOff = (id === 'off');
    railAutoOff = false;
    if (id !== 'off') railWanted = id;
    buildRail();
    var srNow = document.getElementById('selRail');
    if (srNow && srNow.value !== id) srNow.value = id;
    refreshStatus();
  }

  function railOpacity(v) {
    CONFIG.railOpacity = Number(v);
    var op = Math.min(1, Math.max(0.2, CONFIG.railOpacity));
    if (railLayer) {
      if (typeof railLayer.setOpacity === 'function') railLayer.setOpacity(op);
      else if (typeof railLayer.setStyle === 'function') railLayer.setStyle({ opacity: op });
    }
    var rng = document.getElementById('rngRail');
    if (rng) rng.value = Math.round(CONFIG.railOpacity * 100);
    refreshStatus();
  }

  // 切换坐标系后把已有标记/轨迹按新基准重画（坐标系重建时地图实例已换，需重新挂载）
  function rebuildMarkers() {
    for (var k in state) {
      if (!state.hasOwnProperty(k)) continue;
      var st = state[k], d = st.data;
      var pos = toMap(Number(d.lat), Number(d.lon));
      if (!map.hasLayer(st.marker)) st.marker.addTo(map);
      st.marker.setLatLng(pos);
      if (st.line && st.trail.length >= 2) {
        if (!map.hasLayer(st.line)) st.line.addTo(map);
        st.line.setLatLngs(st.trail.map(function (p) { return toMap(p[0], p[1]); }));
      }
    }
  }

  function applyConfig(cfg) {
    CONFIG = mergeConfig(CONFIG, cfg || {});
    // 先定底图，再按底图基准决定铁路图层能不能开——避免「先开 ORM 再切高德」
    // 时弹两次「无法叠加」的提示。
    if (cfg && cfg.base && BASE_SOURCES[cfg.base]) { setBase(cfg.base); }
    if (cfg && cfg.rail && RAIL_SOURCES[cfg.rail]) {
      setRailStyle((isOffsetBase() && cfg.rail !== 'off') ? 'off' : cfg.rail);
    }
    if (cfg && typeof cfg.railOpacity === 'number') railOpacity(cfg.railOpacity);
    if (cfg && typeof cfg.night === 'boolean') api.setNight(cfg.night);
    if (cfg && typeof cfg.follow === 'boolean') api.setFollow(cfg.follow);
    if (cfg && cfg.center && cfg.center.lat && cfg.center.lng && map && !centerApplied) {
      centerApplied = true;
      map.setView(toMap(cfg.center.lat, cfg.center.lng), CONFIG.zoom || map.getZoom(), { animate: false });
    }
    refreshStatus();
  }

  // 显式把视图挪到某个坐标（宿主「中心」按钮 / 配置改了默认中心时用）；入参 WGS-84
  api.setCenter = function (lat, lng, zoom) {
    var la = Number(lat), ln = Number(lng);
    if (!isFinite(la) || !isFinite(ln)) return false;
    centerApplied = true;
    userTouched = false;
    lastAuto = null;
    map.setView(toMap(la, ln), Number(zoom) || CONFIG.zoom || map.getZoom(), { animate: true });
    return true;
  };

  /* ---------------- 8.5 离线瓦片缓存（页面侧，宿主代拉落盘） ---------------- */
  var cacheTotal = 0, cacheDone = 0, cacheStatsJson = null;

  function fmtBytes(n) {
    n = Number(n) || 0;
    if (n > 1e9) return (n / 1e9).toFixed(1) + ' GB';
    if (n > 1e6) return (n / 1e6).toFixed(1) + ' MB';
    if (n > 1e3) return (n / 1e3).toFixed(0) + ' KB';
    return n + ' B';
  }
  function updateCacheLine() {
    var el = document.getElementById('cacheLine');
    if (!el) return;
    var txt = '缓存瓦片 —';
    if (cacheTotal > 0) txt = '缓存进度 ' + cacheDone + '/' + cacheTotal;
    if (cacheStatsJson) {
      txt += ' · 已存 ' + (Number(cacheStatsJson.count) || 0) + ' 张';
      if (cacheStatsJson.bytes != null) txt += ' / ' + fmtBytes(cacheStatsJson.bytes);
    }
    el.textContent = txt;
  }
  function tileUrlFor(src, x, y, z) {
    var subs = String(src.subdomains || 'abc');
    var sub = subs.charAt((x + y) % subs.length);
    var url = String(src.url || '').replace('{key}', CONFIG.tdtKey || '');
    if (isBaiduBase()) {
      var off = Math.pow(2, z - 1);
      url = url.replace('{x}', x - off).replace('{y}', off - y - 1);
    } else {
      url = url.replace('{x}', x).replace('{y}', y);
    }
    return url.replace('{s}', sub).replace('{z}', z);
  }
  function tileUrlsForView(z0, z1) {
    var src = BASE_SOURCES[baseId];
    if (!src || !src.url) return [];
    var b = map.getBounds();
    var urls = [];
    for (var z = z0; z <= z1; z++) {
      var nw = map.project(b.getNorthWest(), z);
      var se = map.project(b.getSouthEast(), z);
      var x0 = Math.floor(nw.x / 256), x1 = Math.floor(se.x / 256);
      var y0 = Math.floor(nw.y / 256), y1 = Math.floor(se.y / 256);
      if ((x1 - x0) > 40 || (y1 - y0) > 40) continue;   // 视野过大时跳过该级
      for (var x = x0; x <= x1; x++) {
        for (var y = y0; y <= y1; y++) urls.push(tileUrlFor(src, x, y, z));
      }
    }
    return urls;
  }
  function cacheArea() {
    if (CONFIG.cacheEnabled === false) { toast('离线缓存已在配置里关闭。', 4000); return; }
    var z0 = Math.min(Math.floor(currentZoom()), 16);
    var z1 = Math.min(z0 + (Number(CONFIG.cacheZoomDelta) || 3), 18);
    var urls = tileUrlsForView(z0, z1);
    if (!urls.length) { toast('当前视野无需缓存。', 3200); return; }
    var host = window.LBJHost;
    if (host && typeof host.cacheArea === 'function') {
      // 宿主支持磁盘缓存：交给宿主代拉落盘（桌面/安卓 v3.1 均实现）
      cacheTotal = urls.length; cacheDone = 0;
      try {
        host.cacheArea(JSON.stringify(urls));
      } catch (e) {
        toast('缓存请求失败：' + escapeHtml(String(e)), 5200);
        return;
      }
      updateCacheLine();
      toast('开始缓存 ' + urls.length + ' 张瓦片（z' + z0 + '~z' + z1 + '）…', 4200);
      return;
    }
    // 兜底：浏览器 HTTP 缓存预热（无需宿主，离线时由 WebView/QtWebEngine 缓存兜底）
    prefetchLocal(urls, z0, z1);
  }
  function prefetchLocal(urls, z0, z1) {
    var i = 0, done = 0, failed = 0;
    cacheTotal = urls.length; cacheDone = 0;
    updateCacheLine();
    function next() {
      if (i >= urls.length) {
        toast('瓦片预取完成：成功 ' + done + ' / 失败 ' + failed +
              '<br>（已进入浏览器缓存，离线时可继续显示）', 5200);
        return;
      }
      var url = urls[i++];
      var img = new Image();
      img.onload = function () { done++; cacheDone = done; updateCacheLine(); next(); };
      img.onerror = function () { failed++; cacheDone = done; updateCacheLine(); next(); };
      img.src = url;
    }
    for (var k = 0; k < 4; k++) next();
    toast('开始预取 ' + urls.length + ' 张瓦片（z' + z0 + '~z' + z1 + '）…', 4200);
  }
  // 宿主回调：进度 / 统计
  api.onCacheProgress = function (done, total) {
    cacheDone = Number(done) || 0;
    if (total) cacheTotal = Number(total);
    updateCacheLine();
    if (cacheTotal > 0 && cacheDone >= cacheTotal) {
      toast('瓦片缓存完成：' + cacheTotal + ' 张。', 3600);
      cacheTotal = 0; cacheDone = 0;
      api.refreshCacheStats();
    }
  };
  api.cacheStats = function (json) {
    try { cacheStatsJson = JSON.parse(json); } catch (e) { cacheStatsJson = null; }
    updateCacheLine();
  };
  api.refreshCacheStats = function () {
    var host = window.LBJHost;
    if (host && typeof host.cacheStats === 'function') {
      try { host.cacheStats(); } catch (e) { /* 宿主不支持时静默 */ }
    }
  };

  /* ---------------- 9. 启动 ---------------- */
  document.getElementById('panelHd').onclick = function () {
    var p = document.getElementById('panel');
    p.classList.toggle('open');
    document.getElementById('panelArrow').textContent = p.classList.contains('open') ? '▴' : '▾';
  };
  var btnCache = document.getElementById('btnCache');
  if (btnCache) btnCache.onclick = function (e) { e.preventDefault(); cacheArea(); };
  api.setNight(night);
  createMap(toMap(CONFIG.center.lat || 28.68, CONFIG.center.lng || 115.86),
            CONFIG.zoom || 11);
  buildBase();
  buildSelects();
  buildRail();
  refreshStatus();
  api.refreshCacheStats();
  updateCacheLine();
  setTimeout(function () { map.invalidateSize(false); }, 60);
  // 之后由宿主调用 resize()（面板尺寸变化时）
})();
</script>
</body>
</html>
